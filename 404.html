<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — the cat took it</title>
<link rel="icon" type="image/png" href="assets/img/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#070a07;--green:#39ff14;--gold:#f4c430;--ink:#e9f5e9;--dim:#8fae8f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;
    background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    background-image:radial-gradient(120% 80% at 50% -10%,rgba(57,255,20,.1),transparent 60%)}
  .mono{font-family:"JetBrains Mono",monospace}
  img{width:min(280px,70vw);border-radius:22px;border:1px solid rgba(57,255,20,.35);
    box-shadow:0 0 40px rgba(57,255,20,.3);margin-bottom:26px}
  h1{font-family:"JetBrains Mono",monospace;font-size:clamp(3rem,14vw,7rem);margin:0;color:var(--gold);
    text-shadow:0 0 30px rgba(244,196,48,.4)}
  p{color:var(--dim);max-width:44ch;margin:10px auto 24px;font-size:1.05rem}
  .blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  a{display:inline-flex;gap:.5em;align-items:center;font-family:"JetBrains Mono",monospace;font-weight:700;
    text-decoration:none;color:#03130a;background:var(--gold);border-radius:12px;padding:13px 24px;
    box-shadow:0 8px 26px -10px rgba(244,196,48,.7)}
</style>
</head>
<body>
  <main>
    <img src="assets/img/mascot.png" alt="Troll Cat grinning" />
    <h1 class="mono">404<span class="blink" style="color:var(--green)">_</span></h1>
    <p>Page not found. The cat took it. He's grinning about it too.</p>
    <a href="/">gm — take me home</a>
  </main>
</body>
</html>
